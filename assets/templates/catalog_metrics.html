<div class="catalog-title">Table Catalog</div>
<div class="metrics">
  <div class="metric">
    <div class="metric-value">{{ table_count }}</div>
    <div class="metric-label">TABLES</div>
  </div>
  <div class="metric">
    <div class="metric-value">{{ view_count }}</div>
    <div class="metric-label">VIEWS</div>
  </div>
  <div class="metric">
    <div class="metric-value">{{ materialized_count }}</div>
    <div class="metric-label">MATERIALIZED VIEWS</div>
  </div>
  <div class="metric">
    <div class="metric-value">{{ row_label }}</div>
    <div class="metric-label">ROWS</div>
  </div>
  <div class="metric">
    <div class="metric-value">{{ size_label }}</div>
    <div class="metric-label">DATA SIZE</div>
  </div>
</div>
